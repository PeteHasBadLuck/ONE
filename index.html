<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONE — Dating, simplified</title><style>:root{--ink:#25231f;--muted:#716d66;--paper:#f7f4ef;--card:#fffdfa;--line:#e5dfd6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;padding:24px}main{width:min(100%,420px)}header{text-align:center;margin-bottom:28px}.logo{font:56px/1.1 Georgia,serif;letter-spacing:.12em;margin:0}.tagline,.intro{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 16px 48px #32251a0b}h1{font:500 30px/1.2 Georgia,serif;text-align:center;margin:0 0 8px}.intro{text-align:center;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:#f0ece5;margin-bottom:22px}.tabs button{border:0;border-radius:9px;background:transparent;padding:11px;font:inherit;color:var(--muted);cursor:pointer}.tabs button[aria-selected=true]{background:white;color:var(--ink);font-weight:650}label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}input:not([type=checkbox]){width:100%;padding:13px 14px;border:1px solid #d9d2c8;border-radius:11px;background:white;font:inherit}.primary{width:100%;border:0;border-radius:12px;background:var(--ink);color:white;padding:14px;font:inherit;font-weight:650;margin-top:22px;cursor:pointer}.fine,.note,footer{font-size:12px;color:var(--muted);text-align:center}.note{font-size:13px;background:#f3eee7;border-radius:10px;padding:12px;margin-top:16px}.status{text-align:center;color:#7d3f36;font-size:14px}.hidden{display:none!important}</style></head><body><main><header><p class="logo">ONE</p><p class="tagline">Less swiping. More meaning.</p></header><section class="panel"><h1>Find your one.</h1><p class="intro">Meet people looking for something real.</p><div class="tabs"><button id="signupTab" aria-selected="true" type="button">Create account</button><button id="signinTab" aria-selected="false" type="button">Sign in</button></div><form id="form"><div id="nameField"><label for="name">First name</label><input id="name" autocomplete="given-name" placeholder="What should we call you?"></div><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required><div id="ageField"><label style="display:flex;gap:10px;align-items:flex-start;font-weight:400"><input id="adult" type="checkbox" required> I confirm that I am 18 or older.</label></div><button class="primary" id="submit" type="submit">Create account</button><p class="status" id="status" aria-live="polite"></p></form><div class="note">Prototype only: authentication is not connected yet. Do not enter a real password.</div><p class="fine">18+ only · One payment · Lifetime access</p></section><footer>Honesty, privacy and genuine connections.</footer></main><script>const a=document.getElementById('signupTab'),b=document.getElementById('signinTab'),n=document.getElementById('nameField'),age=document.getElementById('ageField'),adult=document.getElementById('adult'),pw=document.getElementById('password'),sub=document.getElementById('submit'),status=document.getElementById('status');function mode(s){a.setAttribute('aria-selected',s);b.setAttribute('aria-selected',!s);n.classList.toggle('hidden',!s);age.classList.toggle('hidden',!s);adult.required=s;pw.autocomplete=s?'new-password':'current-password';pw.minLength=s?8:1;sub.textContent=s?'Create account':'Sign in';status.textContent=''}a.onclick=()=>mode(true);b.onclick=()=>mode(false);document.getElementById('form').onsubmit=e=>{e.preventDefault();status.textContent='Prototype only: secure authentication must be connected before use.'};</script></body></html>

name: Build ONE Android preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app.html"
      - "profile.html"
      - "dashboard.html"
      - "index.html"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - ".github/workflows/android-preview.yml"

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ONE
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Build shared web app
        run: npm run build:web
      - name: Verify web bundle
        run: |
          test -f www/index.html
          test -f www/profile.html
          test -f www/app.html
          test -f www/manifest.webmanifest
          test -f www/icons/one.svg
      - name: Generate Android wrapper
        run: npx cap add android
      - name: Sync web app into Android wrapper
        run: npx cap sync android
      - name: Build Android debug APK
        run: |
          cd android
          ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: one-android-debug-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
